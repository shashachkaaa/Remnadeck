<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>RemnaDeck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%233bc9db' stroke-width='4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=__VER__">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<!-- вход и первичная настройка -->
<section id="auth" class="auth" hidden></section>

<!-- панель -->
<div id="shell" class="shell" hidden>
  <aside class="side" id="side" aria-label="Навигация">
    <div class="side-head">
      <div class="brand"><img class="mark" src="/static/logo.svg" alt="" width="30" height="30"><span class="wordmark">Remna<b>Deck</b></span>
        <button class="version" id="version" type="button" hidden title="О панели и обновления"></button></div>
      <button class="icon-btn side-close" id="side-close" aria-label="Закрыть меню">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="nav" class="nav">
      <span class="nav-pill" id="nav-pill" aria-hidden="true"></span>
      <p class="nav-group">Мониторинг</p>
      <a href="#overview" data-icon="grid">Обзор</a>
      <a href="#nodes" data-icon="server">Ноды <span class="badge" id="b-nodes"></span></a>
      <a href="#hosts" data-icon="link">Хосты</a>
      <p class="nav-group">Инфраструктура</p>
      <a href="#servers" data-icon="ssh">Серверы</a>
      <a href="#cdn" data-icon="cloud">CDN</a>
      <a href="#certs" data-icon="shield">Сертификаты</a>
      <p class="nav-group">Клиенты</p>
      <a href="#squads" data-icon="squad">Сквады</a>
      <a href="#quotas" data-icon="gauge">Квоты</a>
      <a href="#users" data-icon="users">Пользователи</a>
      <a href="#statuspage" data-icon="pulse">Статус-страница</a>
      <a href="#subproxy" data-icon="link">Прослойка подписок</a>
      <a href="#automations" data-icon="bolt">Автоматизации</a>
      <a href="#bans" data-icon="shield">Баны</a>
      <p class="nav-group">Журнал</p>
      <a href="#events" data-icon="bell">События <span class="badge bad" id="b-events"></span></a>
      <a href="#jobs" data-icon="clock">Задачи</a>
      <a href="#tools" data-icon="tool">Инструменты</a>
      <p class="nav-group">Настройки</p>
      <a href="#connection" data-icon="plug">Подключение</a>
      <a href="#notifications" data-icon="send">Уведомления</a>
      <a href="#monitoring" data-icon="clock">Опрос и проверки</a>
      <a href="#account" data-icon="key">Учётная запись</a>
    </nav>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="dot"></span><span>Проверяю связь…</span></div>
      <div class="me">
        <span class="avatar" id="avatar"></span>
        <span class="me-name" id="me-name"></span>
        <button class="icon-btn" id="logout" aria-label="Выйти" title="Выйти">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="appbar" id="appbar">
      <button class="icon-btn burger" id="burger" aria-label="Открыть меню">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <span class="appbar-title" id="appbar-title"></span>
      <nav class="appbar-actions" aria-label="Быстрые действия">
        <a class="ab-btn ab-conn" id="ab-conn" href="#connection" title="Связь с Remnawave"><span class="dot"></span><b>…</b></a>
        <a class="ab-btn ab-jobs" id="ab-jobs" href="#jobs" hidden title="Фоновые задачи на серверах"><i class="spin"></i><b id="ab-jobs-n"></b></a>
        <a class="ab-btn ab-icon" id="ab-events" href="#events" title="События за сутки"><span data-ab-icon="bell"></span><em class="ab-badge" id="ab-ev-n" hidden></em></a>
        <button class="ab-btn ab-icon" id="ab-refresh" type="button" title="Обновить раздел"><span data-ab-icon="refresh"></span></button>
      </nav>
    </header>
    <header class="top">
      <div class="top-text">
        <h1 id="title"></h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div class="top-actions" id="actions"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=__VER__"></script>
<script src="/static/manage.js?v=__VER__"></script>
</body>
</html>
